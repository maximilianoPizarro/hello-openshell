schemaVersion: 2.2.2
metadata:
  name: hello-openshell
  displayName: OpenShell on Developer Sandbox
  description: Dev Spaces workspace with the OpenShell 0.1.8 CLI. A Fedora VM runs minikube for the gateway.
  language: Python
  projectType: openshell
  tags:
    - OpenShift
    - OpenShell
    - Python
  attributes:
    controller.devfile.io/storage-type: ephemeral
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 512Mi
      memoryLimit: 4Gi
      cpuRequest: 200m
      cpuLimit: "2"
      mountSources: true
      sourceMapping: /projects
commands:
  - id: install-openshell-cli
    exec:
      component: tools
      commandLine: bash scripts/install-openshell-cli.sh
      workingDir: ${PROJECT_SOURCE}
      label: "1. Install OpenShell CLI"
      group:
        kind: run
        isDefault: false
  - id: project-status
    exec:
      component: tools
      commandLine: bash scripts/sandbox-status.sh
      workingDir: ${PROJECT_SOURCE}
      label: "2. Project status"
      group:
        kind: run
        isDefault: false
  - id: start-minikube-vm
    exec:
      component: tools
      commandLine: bash scripts/sandbox-vm-up.sh
      workingDir: ${PROJECT_SOURCE}
      label: "3. Start minikube VM"
      group:
        kind: run
        isDefault: false
  - id: connect-minikube-gateway
    exec:
      component: tools
      commandLine: bash scripts/sandbox-vm-connect.sh
      workingDir: ${PROJECT_SOURCE}
      label: "4. Connect minikube gateway"
      group:
        kind: run
        isDefault: false
  - id: create-minikube-sandbox
    exec:
      component: tools
      commandLine: bash scripts/sandbox-vm-sandbox.sh
      workingDir: ${PROJECT_SOURCE}
      label: "5. Create minikube sandbox"
      group:
        kind: run
        isDefault: false
  - id: ask-granite
    exec:
      component: tools
      commandLine: bash scripts/sandbox-ask.sh curl
      workingDir: ${PROJECT_SOURCE}
      label: "6. Ask Granite"
      group:
        kind: run
        isDefault: false
  - id: ask-python
    exec:
      component: tools
      commandLine: bash scripts/sandbox-ask.sh python
      workingDir: ${PROJECT_SOURCE}
      label: "7. Ask with ask.py"
      group:
        kind: run
        isDefault: false
  - id: clean
    exec:
      component: tools
      commandLine: bash scripts/sandbox-down.sh
      workingDir: ${PROJECT_SOURCE}
      label: "8. Clean"
      group:
        kind: run
        isDefault: false
  - id: inspect-minikube
    exec:
      component: tools
      commandLine: bash scripts/sandbox-vm-inspect.sh
      workingDir: ${PROJECT_SOURCE}
      label: "9. Inspect cluster"
      group:
        kind: run
        isDefault: false
  - id: start-rhel-vm
    exec:
      component: tools
      commandLine: bash scripts/sandbox-rhel-up.sh
      workingDir: ${PROJECT_SOURCE}
      label: Start RHEL terminal
      group:
        kind: run
        isDefault: false
  - id: openshell-version
    exec:
      component: tools
      commandLine: bash -lc 'bash scripts/install-openshell-cli.sh && openshell --version; openshell status || true'
      workingDir: ${PROJECT_SOURCE}
      label: OpenShell version
      group:
        kind: run
        isDefault: false
  - id: install-openshell-cli-on-start
    exec:
      component: tools
      commandLine: bash -c 'i=0; while [ ! -f scripts/install-openshell-cli.sh ] && [ "$i" -lt 15 ]; do i=$((i+1)); sleep 2; done; bash scripts/install-openshell-cli.sh || echo "OpenShell CLI was not installed. Run task 1. Install OpenShell CLI."'
      workingDir: ${PROJECT_SOURCE}
      label: Install OpenShell CLI on start
events:
  postStart:
    - install-openshell-cli-on-start
