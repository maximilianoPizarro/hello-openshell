# Fedora guest for the Developer Sandbox.
# The OpenShift project cannot serve sandboxes.agents.x-k8s.io.
# This VM is the cluster you administer: minikube, Podman driver, containerd.
#
# scripts/sandbox-vm-up.sh fills the cloud-init placeholder. Inline cloud-init is capped
# at 2048 bytes after the sandbox webhook appends its SSH key, and that text
# must name the fedora user. The guest downloads scripts/minikube-guest-boot.sh.
# There is no Containerfile. A custom disk is a custom image, and Developer
# Sandbox shuts those down. The disk is cloned from the fedora DataSource.
#
# u1.large is 2 vCPU and 8Gi. The project quota on a stock sandbox allows it
# (NotTerminating requests.cpu 3, requests.memory 30Gi) while Dev Spaces is stopped.
# The fedora image is 30Gi. Developer Sandbox powers Linux VMs off after one hour
# and only permits runStrategy Manual. Start the guest with the start subresource.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: minikube-vm
  labels:
    app.kubernetes.io/name: minikube
    app.kubernetes.io/part-of: hello-openshell
spec:
  runStrategy: Manual
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.large
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: minikube-vm-disk
        labels:
          app.kubernetes.io/name: minikube
          app.kubernetes.io/part-of: hello-openshell
      spec:
        sourceRef:
          kind: DataSource
          name: fedora
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minikube
        app.kubernetes.io/part-of: hello-openshell
        kubevirt.io/domain: minikube-vm
    spec:
      terminationGracePeriodSeconds: 120
      domain:
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: gateway
                  port: 8080
                  protocol: TCP
          disks:
            - name: rootdisk
              bootOrder: 1
              disk: {}
            - name: cloudinitdisk
              disk: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: minikube-vm-disk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              __CLOUD_INIT__
---
apiVersion: v1
kind: Service
metadata:
  name: minikube-vm
  labels:
    app.kubernetes.io/name: minikube
    app.kubernetes.io/part-of: hello-openshell
spec:
  selector:
    kubevirt.io/domain: minikube-vm
  ports:
    - name: ssh
      port: 22
      targetPort: 22
    - name: gateway
      port: 8080
      targetPort: 8080
