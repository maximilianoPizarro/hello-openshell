# RHEL 9 guest for a terminal. The gateway stays on the Fedora VM.
# RHEL here is the catalog DataSource rhel9. dnf needs a subscription,
# so this guest does not install minikube.
#
# scripts/sandbox-rhel-up.sh fills the cloud-init placeholder. Inline
# cloud-init is capped at 2048 bytes after the sandbox webhook appends
# its SSH key, and that text must name cloud-user. The disk is 30Gi,
# cloned from rhel9 in openshift-virtualization-os-images. There is no
# Containerfile. Developer Sandbox powers Linux VMs off after one hour
# and only permits runStrategy Manual. Start the guest with the start
# subresource. Stop the Fedora VM first if the project is out of quota.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel-vm
  labels:
    app.kubernetes.io/name: rhel
    app.kubernetes.io/part-of: hello-openshell
spec:
  runStrategy: Manual
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.large
  preference:
    kind: VirtualMachineClusterPreference
    name: rhel.9
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: rhel-vm-disk
        labels:
          app.kubernetes.io/name: rhel
          app.kubernetes.io/part-of: hello-openshell
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhel
        app.kubernetes.io/part-of: hello-openshell
        kubevirt.io/domain: rhel-vm
    spec:
      terminationGracePeriodSeconds: 120
      domain:
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
          disks:
            - name: rootdisk
              bootOrder: 1
              disk: {}
            - name: cloudinitdisk
              disk: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: rhel-vm-disk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              __CLOUD_INIT__
---
apiVersion: v1
kind: Service
metadata:
  name: rhel-vm
  labels:
    app.kubernetes.io/name: rhel
    app.kubernetes.io/part-of: hello-openshell
spec:
  selector:
    kubevirt.io/domain: rhel-vm
  ports:
    - name: ssh
      port: 22
      targetPort: 22
